<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Growing Mondrian</title>

  <link rel="stylesheet" href="style.css">

  <!-- p5.js -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>

  <!-- p5.sound -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/addons/p5.sound.min.js"></script>
</head>

<body>

  <main>

    <header>
      <h1>Growing Mondrian</h1>

      <p class="subtitle">
        Music generates overlapping geometric blocks.
      </p>
    </header>

    <div id="canvas-container"></div>

    <div class="instructions">

      <p>
        <span class="key">SPACE</span>
        Play / Pause
      </p>

      <p>
        <span class="key">R</span>
        Reset composition
      </p>

    </div>

  </main>

  <!-- Each mechanic is stored in a separate script file. -->
  <script src="audio-mechanic.js"></script>
  <script src="sketch.js"></script>

</body>

</html>
